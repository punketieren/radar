name: Update Release Radar

on:
  schedule:
    - cron: '0 10 * * 5'  # каждую пятницу в 10:00 UTC (Spotify обновляет Release Radar по пятницам)
  workflow_dispatch:        # и вручную по кнопке

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run scraper
        env:
          SPOTIFY_USERNAME: ${{ secrets.SPOTIFY_USERNAME }}
          SPOTIFY_PASSWORD: ${{ secrets.SPOTIFY_PASSWORD }}
        run: node scripts/scrape.js

      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Update Release Radar $(date +'%Y-%m-%d')"
          git push
